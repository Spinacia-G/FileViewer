<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="roseCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC143C;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="rosePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF1493;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C71585;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#98FB98;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#32CD32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#228B22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roseStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="budGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#FFF5EE"/>
  
  <!-- Large Rose -->
  <g transform="translate(200,150)">
    <!-- Outer petals -->
    <path d="M 0,-30 Q -15,-25 -20,-10 Q -15,5 0,0 Q 15,5 20,-10 Q 15,-25 0,-30" 
          fill="url(#rosePetal)" opacity="0.9"/>
    <path d="M 0,-30 Q -15,-25 -20,-10 Q -15,5 0,0 Q 15,5 20,-10 Q 15,-25 0,-30" 
          fill="url(#rosePetal)" opacity="0.8" transform="rotate(72)"/>
    <path d="M 0,-30 Q -15,-25 -20,-10 Q -15,5 0,0 Q 15,5 20,-10 Q 15,-25 0,-30" 
          fill="url(#rosePetal)" opacity="0.7" transform="rotate(144)"/>
    <path d="M 0,-30 Q -15,-25 -20,-10 Q -15,5 0,0 Q 15,5 20,-10 Q 15,-25 0,-30" 
          fill="url(#rosePetal)" opacity="0.6" transform="rotate(216)"/>
    <path d="M 0,-30 Q -15,-25 -20,-10 Q -15,5 0,0 Q 15,5 20,-10 Q 15,-25 0,-30" 
          fill="url(#rosePetal)" opacity="0.5" transform="rotate(288)"/>
    
    <!-- Middle petals -->
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(36)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(108)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(180)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(252)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(324)"/>
    
    <!-- Inner petals -->
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)"/>
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)" transform="rotate(60)"/>
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)" transform="rotate(120)"/>
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)" transform="rotate(180)"/>
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)" transform="rotate(240)"/>
    <path d="M 0,-12 Q -6,-10 -8,-4 Q -6,1 0,0 Q 6,1 8,-4 Q 6,-10 0,-12" 
          fill="url(#roseCenter)" transform="rotate(300)"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="4" fill="url(#roseCenter)"/>
    
    <!-- Stem -->
    <rect x="-3" y="25" width="6" height="40" fill="url(#roseStem)"/>
    
    <!-- Thorns -->
    <path d="M -3,35 L -8,33 L -3,31" fill="#228B22"/>
    <path d="M 3,45 L 8,43 L 3,41" fill="#228B22"/>
    <path d="M -3,55 L -8,53 L -3,51" fill="#228B22"/>
    
    <!-- Leaves -->
    <path d="M -15,40 Q -25,35 -30,45 Q -25,55 -15,50 Q -10,45 -15,40" 
          fill="url(#roseLeaf)" transform="rotate(-20 -15 40)"/>
    <path d="M 15,50 Q 25,45 30,55 Q 25,65 15,60 Q 10,55 15,50" 
          fill="url(#roseLeaf)" transform="rotate(20 15 50)"/>
  </g>
  
  <!-- Small Rose -->
  <g transform="translate(100,80) scale(0.6)">
    <!-- Petals -->
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(72)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(144)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(216)"/>
    <path d="M 0,-20 Q -10,-18 -12,-8 Q -10,2 0,0 Q 10,2 12,-8 Q 10,-18 0,-20" 
          fill="url(#rosePetal)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3" fill="url(#roseCenter)"/>
    <!-- Stem -->
    <rect x="-2" y="15" width="4" height="25" fill="url(#roseStem)"/>
  </g>
  
  <!-- Rose Bud -->
  <g transform="translate(320,200) scale(0.7)">
    <!-- Bud -->
    <ellipse cx="0" cy="0" rx="8" ry="15" fill="url(#budGradient)"/>
    <path d="M -6,-10 Q 0,-15 6,-10" stroke="#FF1493" stroke-width="1" fill="none"/>
    <path d="M -4,-5 Q 0,-8 4,-5" stroke="#FF1493" stroke-width="1" fill="none"/>
    
    <!-- Sepals -->
    <path d="M -8,8 Q -12,15 -8,20 Q -4,15 -8,8" fill="url(#roseLeaf)"/>
    <path d="M 0,10 Q -4,17 0,22 Q 4,17 0,10" fill="url(#roseLeaf)"/>
    <path d="M 8,8 Q 12,15 8,20 Q 4,15 8,8" fill="url(#roseLeaf)"/>
    
    <!-- Stem -->
    <rect x="-2" y="20" width="4" height="20" fill="url(#roseStem)"/>
  </g>
  
  <!-- Scattered petals -->
  <ellipse cx="50" cy="200" rx="8" ry="12" fill="url(#rosePetal)" transform="rotate(45 50 200)" opacity="0.7"/>
  <ellipse cx="350" cy="100" rx="6" ry="10" fill="url(#rosePetal)" transform="rotate(-30 350 100)" opacity="0.6"/>
  <ellipse cx="80" cy="250" rx="5" ry="8" fill="url(#rosePetal)" transform="rotate(60 80 250)" opacity="0.5"/>
  
  <!-- Decorative vine -->
  <path d="M 20,20 Q 40,10 60,20 T 100,25 T 140,20" 
        stroke="url(#roseStem)" stroke-width="2" fill="none"/>
  
  <!-- Small leaves on vine -->
  <ellipse cx="35" cy="15" rx="4" ry="8" fill="url(#roseLeaf)" transform="rotate(30 35 15)"/>
  <ellipse cx="75" cy="22" rx="4" ry="8" fill="url(#roseLeaf)" transform="rotate(-45 75 22)"/>
  <ellipse cx="115" cy="18" rx="4" ry="8" fill="url(#roseLeaf)" transform="rotate(60 115 18)"/>
  
  <!-- Title -->
  <text x="200" y="280" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#8B0000">Rose Garden</text>
</svg>