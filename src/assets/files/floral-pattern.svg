<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="petalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF69B4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C71585;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="centerGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#F0F8FF"/>
  
  <!-- Main Flower 1 -->
  <g transform="translate(100,100)">
    <!-- Petals -->
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#petalGradient)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#petalGradient)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#petalGradient)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#petalGradient)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-25" rx="12" ry="20" fill="url(#petalGradient)" transform="rotate(288)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="8" fill="url(#centerGradient)"/>
    <!-- Stem -->
    <rect x="-2" y="8" width="4" height="30" fill="#228B22"/>
    <!-- Leaves -->
    <ellipse cx="-8" cy="20" rx="6" ry="12" fill="url(#leafGradient)" transform="rotate(-30 -8 20)"/>
    <ellipse cx="8" cy="25" rx="6" ry="12" fill="url(#leafGradient)" transform="rotate(30 8 25)"/>
  </g>
  
  <!-- Flower 2 -->
  <g transform="translate(250,150)">
    <!-- Petals -->
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(0)"/>
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(60)"/>
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(120)"/>
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(180)"/>
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(240)"/>
    <path d="M 0,-20 Q -10,-10 0,0 Q 10,-10 0,-20" fill="url(#petalGradient)" transform="rotate(300)"/>
    <!-- Center -->
    <circle cx="0" cy="0" r="6" fill="url(#centerGradient)"/>
  </g>
  
  <!-- Small decorative flowers -->
  <g transform="translate(50,200)">
    <circle cx="0" cy="0" r="8" fill="#FFB6C1"/>
    <circle cx="-6" cy="-6" r="4" fill="#FF69B4"/>
    <circle cx="6" cy="-6" r="4" fill="#FF69B4"/>
    <circle cx="-6" cy="6" r="4" fill="#FF69B4"/>
    <circle cx="6" cy="6" r="4" fill="#FF69B4"/>
    <circle cx="0" cy="0" r="3" fill="#FFD700"/>
  </g>
  
  <g transform="translate(320,80)">
    <circle cx="0" cy="0" r="6" fill="#DDA0DD"/>
    <circle cx="-4" cy="-4" r="3" fill="#DA70D6"/>
    <circle cx="4" cy="-4" r="3" fill="#DA70D6"/>
    <circle cx="-4" cy="4" r="3" fill="#DA70D6"/>
    <circle cx="4" cy="4" r="3" fill="#DA70D6"/>
    <circle cx="0" cy="0" r="2" fill="#FFD700"/>
  </g>
  
  <!-- Decorative vines -->
  <path d="M 10,50 Q 30,30 50,40 T 90,35" stroke="#228B22" stroke-width="3" fill="none"/>
  <path d="M 300,250 Q 320,230 340,240 T 380,235" stroke="#228B22" stroke-width="2" fill="none"/>
  
  <!-- Small leaves along vines -->
  <ellipse cx="25" cy="35" rx="4" ry="8" fill="url(#leafGradient)" transform="rotate(45 25 35)"/>
  <ellipse cx="65" cy="38" rx="4" ry="8" fill="url(#leafGradient)" transform="rotate(-30 65 38)"/>
  <ellipse cx="315" cy="238" rx="3" ry="6" fill="url(#leafGradient)" transform="rotate(60 315 238)"/>
  <ellipse cx="355" cy="238" rx="3" ry="6" fill="url(#leafGradient)" transform="rotate(-45 355 238)"/>
  
  <!-- Title text -->
  <text x="200" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#4B0082">Floral Design Pattern</text>
</svg>