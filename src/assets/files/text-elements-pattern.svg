<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="textGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F0F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D2691E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#CD853F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0522D;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000050"/>
    </filter>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offset"/>
      <feFlood flood-color="#FFFFFF80"/>
      <feComposite in2="offset" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#FFEFD5"/>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="380" height="280" fill="none" 
        stroke="url(#textGold)" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Main Title -->
  <text x="200" y="50" text-anchor="middle" font-family="serif" font-size="32" 
        font-weight="bold" fill="url(#textGold)" filter="url(#shadow)">
    Elegance
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="75" text-anchor="middle" font-family="cursive" font-size="16" 
        fill="url(#textCopper)" style="font-style: italic;">
    ~ in every detail ~
  </text>
  
  <!-- Decorative Script Text -->
  <text x="50" y="120" font-family="cursive" font-size="24" 
        fill="url(#textSilver)" filter="url(#emboss)" transform="rotate(-5 50 120)">
    Beautiful
  </text>
  
  <text x="280" y="140" font-family="serif" font-size="20" 
        fill="url(#textGold)" font-weight="bold" transform="rotate(8 280 140)">
    Handwriting
  </text>
  
  <!-- Ornamental Text Elements -->
  <g transform="translate(200,180)">
    <!-- Decorative flourish -->
    <path d="M -80,0 Q -60,-20 -40,0 T 0,0 T 40,0 Q 60,-20 80,0" 
          stroke="url(#textGold)" stroke-width="2" fill="none"/>
    
    <!-- Central text -->
    <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="18" 
          fill="url(#textCopper)" font-weight="bold">
      Typography
    </text>
    
    <!-- Lower flourish -->
    <path d="M -80,15 Q -60,35 -40,15 T 0,15 T 40,15 Q 60,35 80,15" 
          stroke="url(#textGold)" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Vintage Style Text -->
  <text x="100" y="220" font-family="serif" font-size="14" 
        fill="url(#textCopper)" style="letter-spacing: 3px;">
    VINTAGE
  </text>
  
  <text x="100" y="240" font-family="serif" font-size="12" 
        fill="url(#textSilver)" style="letter-spacing: 2px;">
    COLLECTION
  </text>
  
  <!-- Cursive Words -->
  <text x="280" y="220" font-family="cursive" font-size="18" 
        fill="url(#textGold)" style="font-style: italic;" transform="rotate(-3 280 220)">
    Artistic
  </text>
  
  <text x="300" y="245" font-family="cursive" font-size="16" 
        fill="url(#textCopper)" style="font-style: italic;" transform="rotate(5 300 245)">
    Calligraphy
  </text>
  
  <!-- Decorative Text Ornaments -->
  <g transform="translate(70,160)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="url(#textGold)" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="16" 
          fill="url(#textGold)" font-weight="bold">A</text>
  </g>
  
  <g transform="translate(330,190)">
    <rect x="-12" y="-12" width="24" height="24" fill="none" 
          stroke="url(#textSilver)" stroke-width="2" transform="rotate(45)"/>
    <text x="0" y="5" text-anchor="middle" font-family="serif" font-size="16" 
          fill="url(#textSilver)" font-weight="bold">Z</text>
  </g>
  
  <!-- Small Decorative Text Elements -->
  <text x="50" y="270" font-family="serif" font-size="10" 
        fill="url(#textCopper)" style="letter-spacing: 1px;">
    EST. 2024
  </text>
  
  <text x="350" y="270" font-family="cursive" font-size="12" 
        fill="url(#textGold)" style="font-style: italic;">
    Design
  </text>
  
  <!-- Flourish Elements -->
  <g transform="translate(150,100)">
    <path d="M 0,0 Q 5,-5 10,0 Q 15,5 20,0 Q 25,-3 30,0" 
          stroke="url(#textGold)" stroke-width="1.5" fill="none"/>
    <circle cx="35" cy="0" r="2" fill="url(#textGold)"/>
  </g>
  
  <g transform="translate(250,260)">
    <path d="M 0,0 Q -5,-3 -10,0 Q -15,3 -20,0 Q -25,-2 -30,0" 
          stroke="url(#textSilver)" stroke-width="1.5" fill="none"/>
    <circle cx="-35" cy="0" r="1.5" fill="url(#textSilver)"/>
  </g>
  
  <!-- Corner Ornaments -->
  <g transform="translate(30,30)">
    <path d="M 0,0 L 15,0 M 0,0 L 0,15" stroke="url(#textGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="url(#textGold)"/>
  </g>
  
  <g transform="translate(370,270)">
    <path d="M 0,0 L -15,0 M 0,0 L 0,-15" stroke="url(#textGold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="url(#textGold)"/>
  </g>
  
  <!-- Decorative Initials -->
  <text x="25" y="200" font-family="serif" font-size="36" 
        fill="url(#textGold)" font-weight="bold" opacity="0.3">
    Q
  </text>
  
  <text x="365" y="100" font-family="serif" font-size="28" 
        fill="url(#textSilver)" font-weight="bold" opacity="0.4">
    &amp;
  </text>
</svg>