<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="teacupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFFAF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="teaGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#D2691E;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="saucerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6E6FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8BFD8;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="steamGradient" cx="50%" cy="100%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#FFF8DC"/>
  
  <!-- Main Teacup -->
  <g transform="translate(150,150)">
    <!-- Saucer -->
    <ellipse cx="0" cy="45" rx="35" ry="8" fill="url(#saucerGradient)" stroke="#D8BFD8" stroke-width="1"/>
    
    <!-- Cup Base -->
    <path d="M -25,20 Q -25,45 -20,45 L 20,45 Q 25,45 25,20 L 20,10 L -20,10 Z" 
          fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1.5"/>
    
    <!-- Tea inside cup -->
    <path d="M -22,15 Q -22,35 -18,35 L 18,35 Q 22,35 22,15 L 18,12 L -18,12 Z" 
          fill="url(#teaGradient)"/>
    
    <!-- Cup rim -->
    <ellipse cx="0" cy="10" rx="22" ry="4" fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1"/>
    
    <!-- Handle -->
    <path d="M 25,15 Q 35,20 35,30 Q 35,35 30,35" 
          stroke="#D3D3D3" stroke-width="3" fill="none"/>
    <path d="M 25,15 Q 34,20 34,30 Q 34,34 30,34" 
          stroke="url(#teacupGradient)" stroke-width="2" fill="none"/>
    
    <!-- Decorative pattern on cup -->
    <circle cx="-10" cy="25" r="2" fill="#FFB6C1" opacity="0.7"/>
    <circle cx="0" cy="22" r="2" fill="#98FB98" opacity="0.7"/>
    <circle cx="10" cy="25" r="2" fill="#87CEEB" opacity="0.7"/>
    
    <!-- Steam -->
    <path d="M -5,8 Q -8,0 -5,-8 Q -2,-12 -5,-20" 
          stroke="url(#steamGradient)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 0,8 Q 3,0 0,-8 Q -3,-12 0,-20" 
          stroke="url(#steamGradient)" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M 5,8 Q 8,0 5,-8 Q 2,-12 5,-20" 
          stroke="url(#steamGradient)" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Small Teacup -->
  <g transform="translate(300,100) scale(0.6)">
    <!-- Saucer -->
    <ellipse cx="0" cy="45" rx="35" ry="8" fill="url(#saucerGradient)" stroke="#D8BFD8" stroke-width="1"/>
    
    <!-- Cup Base -->
    <path d="M -25,20 Q -25,45 -20,45 L 20,45 Q 25,45 25,20 L 20,10 L -20,10 Z" 
          fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1.5"/>
    
    <!-- Tea inside cup -->
    <path d="M -22,15 Q -22,35 -18,35 L 18,35 Q 22,35 22,15 L 18,12 L -18,12 Z" 
          fill="url(#teaGradient)"/>
    
    <!-- Cup rim -->
    <ellipse cx="0" cy="10" rx="22" ry="4" fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1"/>
    
    <!-- Handle -->
    <path d="M 25,15 Q 35,20 35,30 Q 35,35 30,35" 
          stroke="#D3D3D3" stroke-width="3" fill="none"/>
    <path d="M 25,15 Q 34,20 34,30 Q 34,34 30,34" 
          stroke="url(#teacupGradient)" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Teapot -->
  <g transform="translate(80,200) scale(0.8)">
    <!-- Teapot body -->
    <ellipse cx="0" cy="0" rx="30" ry="25" fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="2"/>
    
    <!-- Teapot spout -->
    <path d="M -25,0 Q -40,-10 -45,-5 Q -50,0 -45,5" 
          stroke="#D3D3D3" stroke-width="3" fill="none"/>
    <path d="M -25,0 Q -39,-9 -44,-5 Q -48,0 -44,4" 
          stroke="url(#teacupGradient)" stroke-width="2" fill="none"/>
    
    <!-- Teapot handle -->
    <path d="M 25,-10 Q 40,-15 40,0 Q 40,15 25,10" 
          stroke="#D3D3D3" stroke-width="3" fill="none"/>
    <path d="M 25,-10 Q 38,-14 38,0 Q 38,14 25,10" 
          stroke="url(#teacupGradient)" stroke-width="2" fill="none"/>
    
    <!-- Teapot lid -->
    <ellipse cx="0" cy="-20" rx="20" ry="6" fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1.5"/>
    <circle cx="0" cy="-25" r="3" fill="url(#teacupGradient)" stroke="#D3D3D3" stroke-width="1"/>
    
    <!-- Decorative pattern -->
    <circle cx="-8" cy="-5" r="3" fill="#FFB6C1" opacity="0.6"/>
    <circle cx="0" cy="5" r="3" fill="#98FB98" opacity="0.6"/>
    <circle cx="8" cy="-5" r="3" fill="#87CEEB" opacity="0.6"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="4" fill="#FFB6C1" opacity="0.8"/>
  <circle cx="350" cy="250" r="3" fill="#98FB98" opacity="0.8"/>
  <circle cx="30" cy="150" r="2" fill="#87CEEB" opacity="0.8"/>
  
  <!-- Title -->
  <text x="200" y="30" text-anchor="middle" font-family="serif" font-size="18" font-weight="bold" fill="#8B4513">Teacup Collection</text>
</svg>